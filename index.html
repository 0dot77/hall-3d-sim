<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hall 3D Sim</title>
<style>body{margin:0;overflow:hidden;font-family:system-ui;background:#111}#info{position:fixed;left:10px;top:10px;color:#fff;background:#0009;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.5}
#gal{position:fixed;left:10px;bottom:10px;display:flex;gap:4px}#gal img{width:80px;height:60px;object-fit:cover;border:2px solid #fff6;cursor:pointer}
#big{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center}#big img{max-width:90%;max-height:90%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","lil-gui":"https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"}}</script>
</head><body><div id="info"></div><div id="gal"></div><div id="big" onclick="this.style.display='none'"><img></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
import GUI from 'lil-gui';
const P={width:14.7,tiers:8,rise:0.42,depth:0.9,flat:5.5,ceiling:7.8,stairW:1.5,grid:true,walk:false};
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);
r.shadowMap.enabled=true;r.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(r.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdcdcd6);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.05,200);
const orbit=new OrbitControls(cam,r.domElement);const fp=new PointerLockControls(cam,document.body);
scene.add(new THREE.HemisphereLight(0xffffff,0x887766,1.4));
const sun=new THREE.DirectionalLight(0xfff4e0,1.6);sun.position.set(3,14,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});scene.add(sun);
const M={wood:new THREE.MeshStandardMaterial({color:0xd9a86a,roughness:.55}),woodDark:new THREE.MeshStandardMaterial({color:0xc08f55,roughness:.6}),
floor:new THREE.MeshStandardMaterial({color:0xb8b3aa,roughness:.7}),carpet:new THREE.MeshStandardMaterial({color:0x4b5157,roughness:1}),
wallG:new THREE.MeshStandardMaterial({color:0x8e9196,roughness:.8,metalness:.2}),wallB:new THREE.MeshStandardMaterial({color:0xd8d0bf,roughness:.95}),
ceil:new THREE.MeshStandardMaterial({color:0xeeeae2,roughness:.9}),led:new THREE.MeshStandardMaterial({color:0x0a0a0c,roughness:.25,metalness:.6,emissive:0x050510}),
glass:new THREE.MeshStandardMaterial({color:0xcfe3ea,transparent:true,opacity:.25,roughness:.05}),slat:new THREE.MeshStandardMaterial({color:0xe6dccb,roughness:.7}),
white:new THREE.MeshStandardMaterial({color:0xf2f2f0,roughness:.6}),red:new THREE.MeshStandardMaterial({color:0xcc1111}),sky:new THREE.MeshBasicMaterial({color:0xffffff})};
let room=new THREE.Group();scene.add(room);
function box(w,h,d,m,x,y,z,g=room){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o}
let D={};
function build(){scene.remove(room);room=new THREE.Group();scene.add(room);
 const W=P.width,hw=W/2,bd=P.tiers*P.depth,L=bd+P.flat,H=P.ceiling;D={W,L,H,bleacherH:P.tiers*P.rise};
 // z: back wall (door/clock) at z=-bd, LED wall at z=+P.flat
 const zb=-bd,zf=P.flat;
 box(W,.05,L,M.floor,0,-.025,(zb+zf)/2);
 box(W,.1,L,M.ceil,0,H+.05,(zb+zf)/2);
 for(let a=0;a<5;a++)for(let b=0;b<4;b++){const x=-hw+W*(a+.5)/5,z=zb+L*(b+.5)/4;box(1.4,.02,1.4,M.sky,x,H-.01,z);
  box(W/5-.05,.25,.1,M.ceil,x,H-.12,z-L/8);box(.1,.25,L/4,M.ceil,x-W/10,H-.12,z)}
 // top landing deck + slatted wall + speaker
 box(W,.08,1.6,M.wood,0,P.tiers*P.rise+.04-.04,zb+.8);box(W,P.tiers*P.rise,1.6,M.woodDark,0,P.tiers*P.rise/2-.04,zb+.8);
 for(let x=-hw;x<hw;x+=.3)box(.06,3,.06,M.wallG,x,P.tiers*P.rise+1.5,zb+.05);box(.4,.6,.3,M.led,-hw+2,P.tiers*P.rise+2.6,zb+.25);
 // back wall: grey lower, beige upper
 const lowH=P.tiers*P.rise+3.2;box(W,lowH,.2,M.wallG,0,lowH/2,zb-.1);box(W,H-lowH,.2,M.wallB,0,lowH+(H-lowH)/2,zb-.1);
 const top=P.tiers*P.rise;box(1.6,2.2,.05,M.white,-2,top+1.1,zb+.01);box(.9,2.1,.05,new THREE.MeshStandardMaterial({color:0x333}),2.6,top+1.05,zb+.01);
 const clk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.04,32),M.white);clk.rotation.x=Math.PI/2;clk.position.set(.6,top+2.6,zb+.03);room.add(clk);
 // left wall (stairs side) wood
 box(.2,H,L,M.wallB,-hw-.1,H/2,(zb+zf)/2);
 // bleachers
 const sx0=-hw+P.stairW;
 for(let i=0;i<P.tiers;i++){const h=(i+1)*P.rise,z0=zf-P.flat- i*P.depth;
  box(W-P.stairW,h,P.depth,i%2?M.wood:M.woodDark,(sx0+hw)/2,h/2,z0-P.depth/2);
  // half-step blocks
  for(let k=0;k<3;k++){const bx=sx0+2+k*4.2+(i%2)*1.5;if(bx<hw-.6)box(1.1,P.rise/2,.45,M.wood,bx,h+P.rise/2*0+ (i<P.tiers-1?P.rise/4:0)-(i<P.tiers-1?0:999),z0-P.depth+.22)}
 }
 // front step blocks on floor
 for(let k=0;k<3;k++)box(1.2,P.rise/2,.5,M.wood,sx0+3+k*4,P.rise/4,zf-P.flat+.3);
 // carpeted staircase: double steps
 const n=P.tiers*2;for(let i=0;i<n;i++){const h=(i+1)*P.rise/2;box(P.stairW,h,P.depth/2,M.carpet,-hw+P.stairW/2,h/2,zf-P.flat-i*P.depth/2-P.depth/4)}
 // right side: mezzanine glass + slats
 const xr=hw;box(.2,3.2,L,M.white,xr+.6,1.6,(zb+zf)/2).material=M.glass;
 box(1.2,.3,L,M.white,xr+.6,4.2,(zb+zf)/2);
 box(.1,2.6,L,M.glass,xr+.4,5.6,(zb+zf)/2);
 for(let z=zb;z<zf;z+=.45)box(.08,H-4.3,.12,M.slat,xr+.1,4.3+(H-4.3)/2,z);
 for(let z=zb;z<zf;z+=.45)box(.04,2.6,.12,M.woodDark,xr+.9,5.6,z);
 box(.2,H,L,M.wallB,xr+1.3,H/2,(zb+zf)/2);
 // white parapet ledge along long side
 box(.3,1.1,bd,M.white,xr-.15,P.tiers*P.rise/2+.55,zb+bd/2);
 // LED wall side
 box(W+1.4,H,.2,M.wallB,.7,H/2,zf+.1);
 box(8,3.5,.15,M.led,-1.5,2.5,zf-.08);
 box(1.6,.95,.08,M.led,4.2,1.4,zf-1.2);box(.08,.8,.08,M.white,4.2,.4,zf-1.2);
 box(.6,1.1,.45,M.woodDark,1.8,.55,zf-1.0);
 // entrance column, glass door, extinguisher (front-right)
 box(.45,H,.45,M.white,xr+.25,H/2,zf-1.6);box(.05,2.6,1.6,M.glass,xr+.9,1.3,zf-.9);box(3,2,.05,new THREE.MeshStandardMaterial({color:0xeef2f2,transparent:true,opacity:.8}),5,3,zf-.02);
 const ex=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.5,16),M.red);ex.position.set(xr-.05,.25,zf-1.9);room.add(ex);
 grid.position.set(0,.01,(zb+zf)/2);grid.scale.set(Math.ceil(W),1,Math.ceil(L));
 info();
}
const grid=new THREE.GridHelper(1,1,0xff3333,0x3366ff);grid.material.opacity=.5;grid.material.transparent=true;
// unit grid: rebuild as 1m spacing
function mkGrid(){scene.remove(grid);}
let g1;function updGrid(){if(g1)scene.remove(g1);const s=Math.ceil(Math.max(D.W,D.L))+2;g1=new THREE.GridHelper(s,s,0xff3333,0x3366ff);g1.material.transparent=true;g1.material.opacity=.45;g1.position.set(0,.012,(P.flat-P.tiers*P.depth)/2);g1.visible=P.grid;scene.add(g1)}
function info(){document.getElementById('info').innerHTML=`<b>강당 3D (추정)</b><br>가로 ${D.W.toFixed(1)}m × 깊이 ${D.L.toFixed(1)}m × 천장 ${D.H.toFixed(1)}m<br>계단석 ${P.tiers}단 · 단높이 ${P.rise}m · 단깊이 ${P.depth}m (최상단 ${D.bleacherH.toFixed(2)}m)<br>앞 평지 ${P.flat}m · 그리드 1m<br>${P.walk?'WASD 이동 · 클릭으로 시점 잠금 · Esc':'드래그 회전 · 휠 줌'}`}
function rebuild(){build();updGrid()}rebuild();
cam.position.set(4,4,P.flat+0.0-0.5);cam.position.set(5.5,3.2,P.flat-0.6);orbit.target.set(-1,1.2,-3);orbit.update();
const q=new URLSearchParams(location.search);if(q.get('view')==='front'){cam.position.set(-3,1.6,P.flat-1);orbit.target.set(2,1.5,-4);orbit.update()}
if(q.get('view')==='top'){cam.position.set(0,24,0);orbit.target.set(0,0,-1);orbit.update()}
if(q.get('view')==='back'){cam.position.set(0,P.tiers*P.rise+1.6,-P.tiers*P.depth+.5);orbit.target.set(0,1.5,P.flat);orbit.update()}
const gui=new GUI();gui.add(P,'width',10,20,.1).name('가로(m)').onChange(rebuild);gui.add(P,'tiers',4,12,1).name('단 수').onChange(rebuild);
gui.add(P,'rise',.25,.6,.01).name('단높이').onChange(rebuild);gui.add(P,'depth',.6,1.4,.05).name('단깊이').onChange(rebuild);
gui.add(P,'flat',2,10,.1).name('앞 평지').onChange(rebuild);gui.add(P,'ceiling',5,10,.1).name('천장').onChange(rebuild);
gui.add(P,'grid').name('1m 그리드').onChange(v=>g1.visible=v);
gui.add(P,'walk').name('1인칭 걷기').onChange(v=>{orbit.enabled=!v;if(v){cam.position.set(0,1.6,P.flat-1.5);cam.lookAt(0,1.6,-5)}info()});
document.addEventListener('click',e=>{if(P.walk&&e.target===r.domElement)fp.lock()});
const keys={};addEventListener('keydown',e=>keys[e.code]=1);addEventListener('keyup',e=>keys[e.code]=0);
const gal=document.getElementById('gal');for(let i=1;i<=17;i++){const im=new Image();im.src=`assets/photo${i}.jpg`;im.onclick=()=>{const b=document.getElementById('big');b.querySelector('img').src=im.src;b.style.display='flex'};gal.appendChild(im)}
const clock=new THREE.Clock();
function floorH(x,z){const zf=P.flat;if(z>zf-P.flat)return 0;const i=Math.min(P.tiers,Math.ceil((zf-P.flat-z)/P.depth));return i*P.rise}
(function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();
 if(P.walk&&fp.isLocked){const s=3*dt;if(keys.KeyW)fp.moveForward(s);if(keys.KeyS)fp.moveForward(-s);if(keys.KeyA)fp.moveRight(-s);if(keys.KeyD)fp.moveRight(s);
  cam.position.y=floorH(cam.position.x,cam.position.z)+1.6}
 r.render(scene,cam)})();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
